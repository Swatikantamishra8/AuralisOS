# ==============================================================================
# AuralisOS Wayfire Configuration: /etc/wayfire/wayfire.ini
# Phase 2: "Liquid Glass" Wayland Desktop Environment (<95MB Idle RAM)
# Features: Dual-Kawase Blur, Rounded Corners, Smooth Transitions, Hardware Fallback
# ==============================================================================

[core]
plugins = \
  autostart \
  blur \
  rounded-corners \
  animate \
  vswitch \
  command \
  grid \
  move \
  resize \
  place \
  window-rules \
  wm-actions \
  fast-switcher

# Workspace Grid: 2 columns x 1 row for ultra-low memory overhead
vwidth = 2
vheight = 1

# Window Management Keybindings
close_top_view = <super> KEY_Q | <alt> KEY_F4
focus_change = <super> KEY_TAB

# Default background color: Deep Onyx / Midnight Glass
background_color = 0.05 0.07 0.10 1.0

# ------------------------------------------------------------------------------
# 1. Dual-Kawase Background Blur
#    Creates the signature "Liquid Glass" frosted translucent effect
# ------------------------------------------------------------------------------
[blur]
method = dual_kawase
# Optimized Kawase parameters for low GPU / CPU resource consumption
kawase_offset = 3
kawase_degrade = 1
kawase_iterations = 3
mode = normal
blur_by_default = all
saturation = 1.2
contrast = 1.05
brightness = 0.95
toggle = <super> KEY_B

# ------------------------------------------------------------------------------
# 2. Window Aesthetics & Rounded Corners
# ------------------------------------------------------------------------------
[rounded-corners]
corner_radius = 12
blur = 1

[animate]
open_animation = zoom
close_animation = zoom
duration = 180
startup_duration = 240

# Smooth Workspace Switching Animation
[vswitch]
duration = 200
gap = 20
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2

# ------------------------------------------------------------------------------
# 3. Keybindings & Task Manager Hotkey
#    Requirement: <ctrl> <shift> KEY_ESC -> AuralisOS Task Manager
# ------------------------------------------------------------------------------
[command]
# Task Manager Shortcut (Ctrl + Shift + Esc)
binding_taskmgr = <ctrl> <shift> KEY_ESC
command_taskmgr = /usr/local/bin/auralis-taskmgr

# Terminal Shortcut (Super + Enter or Ctrl + Alt + T)
binding_terminal = <super> KEY_ENTER
command_terminal = foot

binding_terminal_alt = <ctrl> <alt> KEY_T
command_terminal_alt = foot

# Launcher Shortcut (Super / Windows key)
binding_launcher = <super>
command_launcher = /usr/local/bin/auralis-shell --toggle-launcher

# Screen Lock & System Actions
binding_lock = <super> KEY_L
command_lock = /usr/local/bin/auralis-taskmgr --control-center

# Window Snapping Grid
[grid]
duration = 150
snap_distance = 15

# Window Manipulation
[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

# ------------------------------------------------------------------------------
# 4. Liquid Glass Window Rules
# ------------------------------------------------------------------------------
[window-rules]
# Apply subtle translucency for native Auralis tools to trigger compositor Kawase blur
rule_shell = on created if app_id is "auralis-shell" then set alpha 0.92
rule_taskmgr = on created if app_id is "auralis-taskmgr" then set alpha 0.94
rule_store = on created if app_id is "auralis-store" then set alpha 0.94
rule_installer = on created if app_id is "auralis-installer" then set alpha 0.95
rule_term = on created if app_id is "foot" then set alpha 0.88

# ------------------------------------------------------------------------------
# 5. Autostart Native Desktop Shell
# ------------------------------------------------------------------------------
[autostart]
# Launch our single-binary GTK4 Liquid Glass shell
shell = /usr/local/bin/auralis-shell
# Launch Graphical System Installer on boot
installer = /usr/local/bin/auralis-installer
# Notification / wallpaper fallback if needed
wallpaper = fbv -c /usr/share/backgrounds/auralis-glass.png || true
