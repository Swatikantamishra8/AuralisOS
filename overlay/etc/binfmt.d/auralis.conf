# ==============================================================================
# AuralisOS Binary Format Registration: /etc/binfmt.d/auralis.conf
# Phase 3: Kernel binfmt_misc Auto-Routing to /usr/bin/auralis-router
# Registers: Windows PE (MZ) and Apple macOS Mach-O Magic Bytes
# Format: :name:type:offset:magic:mask:interpreter:flags
# ==============================================================================

# 1. Windows Portable Executable (PE) / DOS Executable Magic (MZ)
:windows_pe:M::MZ::/usr/bin/auralis-router:P

# 2. Apple macOS Mach-O 64-bit Binary (\xcf\xfa\xed\xfe)
:macho64:M::\xcf\xfa\xed\xfe::/usr/bin/auralis-router:P

# 3. Apple macOS Mach-O Universal / Fat Binary (\xca\xfe\xba\xbe)
:machofat:M::\xca\xfe\xba\xbe::/usr/bin/auralis-router:P

# 4. Apple macOS Mach-O 32-bit Binary (\xce\xfa\xed\xfe)
:macho32:M::\xce\xfa\xed\xfe::/usr/bin/auralis-router:P

# 5. Apple macOS Mach-O 64-bit Big-Endian Binary (\xfe\xed\xfa\xcf)
:macho64_be:M::\xfe\xed\xfa\xcf::/usr/bin/auralis-router:P

# 6. Apple macOS Mach-O Universal Big-Endian Binary (\xbe\xba\xfe\xca)
:machofat_be:M::\xbe\xba\xfe\xca::/usr/bin/auralis-router:P
