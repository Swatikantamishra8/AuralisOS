<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0080ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0d131f"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Central Liquid Glass Diamond -->
  <polygon points="64,22 106,64 64,106 22,64" fill="url(#glassGrad)" filter="url(#glow)"/>
  <polygon points="64,34 94,64 64,94 34,64" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="10" fill="#ffffff" fill-opacity="0.9"/>
</svg>