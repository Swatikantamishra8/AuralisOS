name: Build AuralisOS Debian ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian:
    name: Build AuralisOS Debian 13 (Trixie) ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hermetic Debian Builder Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.builder.debian
          load: true
          tags: auralis-builder-debian:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile AuralisOS Debian Bootable ISO
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          docker run --privileged --rm -v "${{ github.workspace }}:/workspace" auralis-builder-debian:latest \
            /bin/bash -c "bash /workspace/scripts/build-iso-debian.sh /workspace/dist"

      - name: Verify and List ISO Output
        run: |
          sudo chown -R "$USER:$USER" dist
          cd dist
          ls -lh
          cat *.sha256 || true

      - name: Upload Debian ISO Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralis-os-debian-iso
          path: |
            dist/auralis-os-debian-x86_64.iso*
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/auralis-os-debian-x86_64.iso
            dist/auralis-os-debian-x86_64.iso.sha256
          generate_release_notes: true
