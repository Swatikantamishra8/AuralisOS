name: Build AuralisOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'ISO flavor to compile (metal=full bare-metal drivers, vm=slim QEMU/VirtualBox)'
        required: true
        default: 'metal'
        type: choice
        options:
          - metal
          - vm

permissions:
  contents: write

jobs:
  build:
    name: Build AuralisOS ISO (${{ inputs.flavor || 'metal' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hermetic Alpine Builder Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.builder
          load: true
          tags: auralis-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile Native Desktop Applications & Binary Router
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" auralis-builder:latest \
            /bin/bash -c "make -C /workspace desktop-bins"

      - name: Compile AuralisOS Bootable ISO
        run: |
          FLAVOR="${{ inputs.flavor || 'metal' }}"
          echo "Building flavor: $FLAVOR"
          mkdir -p "${{ github.workspace }}/dist"
          docker run --privileged --rm -v "${{ github.workspace }}:/workspace" auralis-builder:latest \
            /bin/bash -c "bash /workspace/scripts/build-iso.sh $FLAVOR /workspace/dist"

      - name: Compute SHA256 Checksums
        run: |
          cd dist
          for iso in *.iso; do
            if [ -f "$iso" ]; then
              sha256sum "$iso" > "${iso}.sha256"
            fi
          done
          ls -la

      - name: Upload ISO Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralis-os-iso
          path: |
            dist/*.iso
            dist/*.sha256
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/*.sha256
            installer/windows/Auralis-Installer.exe
          generate_release_notes: true
